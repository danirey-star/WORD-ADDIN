<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glosario Doblaje</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <link rel="stylesheet" type="text/css" href="taskpane.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Glosario Doblaje</h1>
        </header>
        
        <main>
            <section class="actions">
                <button id="btnReview" class="btn btn-primary">
                    Revisar documento con glosario
                </button>
                
                <button id="btnAddWord" class="btn btn-secondary">
                    Añadir palabra al glosario
                </button>
                
                <button id="btnAssignActor" class="btn btn-secondary">
                    Asignar actor a personaje
                </button>
                
                <hr style="margin: 16px 0; border: none; border-top: 1px solid #ddd;" />
                
                <button id="btnImportGlossary" class="btn btn-secondary" style="font-size: 12px;">
                    Importar glosario desde archivo
                </button>
                <input type="file" id="fileInput" accept=".txt,.json" style="display: none;" />
            </section>
            
            <section class="modal" id="modalAddWord" style="display: none;">
                <div class="modal-content">
                    <h3>Nueva palabra</h3>
                    <p id="modalWordText"></p>
                    <input type="text" id="inputPronunciation" placeholder="Introduce la pronunciación" />
                    <div class="modal-buttons">
                        <button id="btnConfirmAdd" class="btn btn-primary">Confirmar</button>
                        <button id="btnCancelAdd" class="btn btn-secondary">Cancelar</button>
                    </div>
                </div>
            </section>
            
            <section class="modal" id="modalAssignActor" style="display: none;">
                <div class="modal-content">
                    <h3>Asignar actor</h3>
                    <p id="modalCharacterText"></p>
                    <input type="text" id="inputActor" placeholder="Nombre del actor" />
                    <div class="modal-buttons">
                        <button id="btnConfirmActor" class="btn btn-primary">Confirmar</button>
                        <button id="btnCancelActor" class="btn btn-secondary">Cancelar</button>
                    </div>
                </div>
            </section>
            
            <section class="status">
                <div id="statusMessage"></div>
            </section>
        </main>
    </div>
    
    <script src="taskpane.js"></script>
</body>
</html>
